name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@10.33.0
      - name: Build
        working-directory: app
        run: ./gradlew build -x test -x :megarepo-integration-tests:test
      - uses: actions/upload-artifact@v4
        with:
          name: megarepo-jar
          path: app/megarepo-app/build/libs/megarepo.jar
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@10.33.0
      - name: Unit tests
        working-directory: app
        run: ./gradlew test -x :megarepo-integration-tests:test -x :megarepo-web-ui:npmInstall -x :megarepo-web-ui:frontendBuild -x :megarepo-web-ui:copyFrontend

  package:
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: megarepo-jar
          path: app/megarepo-app/build/libs/
      - name: Determine version
        run: |
          git fetch --tags --force
          echo "FULL_VERSION=$(git describe --abbrev=10 --tags --always)" >> $GITHUB_ENV
      - name: Build Docker image
        run: |
          docker build --build-arg VERSION=$FULL_VERSION \
            -t bsnsoft/megarepo:$FULL_VERSION \
            -t bsnsoft/megarepo:latest \
            app/
      - name: Push to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push bsnsoft/megarepo:$FULL_VERSION
          docker push bsnsoft/megarepo:latest
