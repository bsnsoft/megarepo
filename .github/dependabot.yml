# Dependabot — Versions- und Sicherheitsupdates für MegaRepo.
# (Der Renovate-Bot der claude-managed-Gruppe deckt nur GitLab ab; GitHub braucht Dependabot.)
version: 2
updates:
  - package-ecosystem: gradle
    directory: /app
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, gradle]
    # Die Major-Sperren für Flyway/Testcontainers/Tomcat sind mit dem Upgrade auf
    # Spring Boot 4 entfallen. Majors kommen weiter als Einzel-PR (die Gruppe oben
    # nimmt nur minor/patch) und werden vor dem Merge gegen das Boot-BOM geprüft.

  - package-ecosystem: npm
    directory: /app/megarepo-web-ui/frontend
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, npm]

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
      day: saturday
    labels: [dependencies, docker]
    ignore:
      # Laufzeit-JRE bleibt auf der LTS, gegen die gebaut wird (Java 21).
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    labels: [dependencies, ci]
