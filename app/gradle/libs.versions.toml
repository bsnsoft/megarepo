# NOTE: postgresql, flyway, testcontainers and commons-codec are ALSO managed by the
# Spring Boot BOM. An explicit version here WINS over the BOM, so these entries must be
# kept in sync with spring-boot's managed versions rather than pinned above (or silently
# below) them. `./gradlew :<module>:dependencyInsight --dependency <group>:<name>` shows
# what actually resolves.
[versions]
spring-boot = "3.5.16"
spring-dependency-management = "1.1.7"
postgresql = "42.7.11" # = spring-boot 3.5.16 BOM
# Held at 10.x on purpose: Flyway 11+ is a major upgrade (the Spring Boot 3.5 BOM would
# pull 11.7.2). 10.22.0 is the last 10.x release.
flyway = "10.22.0"
jjwt = "0.12.7"
springdoc = "2.9.0"
testcontainers = "1.21.4" # = spring-boot 3.5.16 BOM
guava = "33.7.1-jre"
aws-sdk = "2.54.2"
spotless = "7.2.1"

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }

postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

springdoc-openapi-starter = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }

guava = { module = "com.google.guava:guava", version.ref = "guava" }
commons-codec = { module = "commons-codec:commons-codec", version = "1.18.0" } # = spring-boot 3.5.16 BOM
jackson-dataformat-xml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-xml" }

aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
aws-sdk-s3 = { module = "software.amazon.awssdk:s3" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
