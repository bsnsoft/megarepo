spring:
  application:
    name: megarepo
  config:
    import: optional:classpath:megarepo-version.properties
  datasource:
    url: jdbc:postgresql://localhost:5432/megarepo?stringtype=unspecified
    username: megarepo
    password: megarepo
    # HikariCP connection pool tuning (issue #89)
    # maximum-pool-size: max concurrent connections (default 10, tuned to 20 for moderate load)
    # minimum-idle: connections kept alive when idle (saves reconnect cost)
    # idle-timeout: 5 min — idle connections beyond minimum-idle are closed after this
    # max-lifetime: 10 min — connections recycled to avoid stale/leaked connections
    # connection-timeout: 10s — fail fast if pool is exhausted
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 10000
      pool-name: MegaRepoPool
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  lifecycle:
    timeout-per-shutdown-phase: 30s
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholder-replacement: false
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true
  forward-headers-strategy: native
  ssl:
    enabled: false
    # To enable TLS, set enabled: true and provide a PKCS12 keystore:
    #   key-store: file:/path/to/keystore.p12
    #   key-store-password: changeit
    #   key-store-type: PKCS12
    # See docs/tls-setup.md for details.

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

# Actuator endpoints for monitoring (issues #62, #89)
# /actuator/health and /actuator/info are public (see SecurityConfig)
# /actuator/metrics and /actuator/prometheus require authentication
# Prometheus endpoint exposes all metrics in OpenMetrics format for scraping
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  metrics:
    tags:
      application: megarepo

megarepo:
  data-directory: ./data
  blob-stores:
    default-path: ./data/blobs/default
  security:
    jwt:
      secret: ${MEGAREPO_JWT_SECRET:change-me-in-production}
      # Lifetime of a UI session token. 12h covers a full work day; the web UI
      # additionally renews the token periodically while it is open (sliding
      # session), so active users are never logged out mid-work.
      access-token-expiry: 12h
      refresh-token-expiry: 7d
    default-admin-password: admin123
  proxy:
    user-agent: MegaRepo/1.0
    connect-timeout: 10s
    read-timeout: 30s
    retry-on-timeout: 1
  # Global outbound (egress) proxy for all upstream fetches, e.g. when MegaRepo
  # runs behind a corporate forward proxy that requires authentication.
  # All values can be set via environment variables (MEGAREPO_OUTBOUNDPROXY_HOST etc.).
  # See docs/admin-guide.md "Running Behind a Corporate Proxy".
  outbound-proxy:
    enabled: false
    host: ""
    port: 3128
    username: ""
    password: ""
    # Hosts/patterns that bypass the proxy, e.g. ["localhost", "*.internal.example.com"]
    non-proxy-hosts: []
  firewall:
    # GitHub Advisory (GHSA) source of the repository firewall.
    #
    # The token is optional and MegaRepo starts without it — but GitHub's anonymous
    # limit of 60 requests/hour per IP cannot carry an advisory import, so without a
    # token this one source disables itself (visible as "disabled:no-token" in
    # advisory_sync_state.cursor) and makes no requests at all. NVD and OSV are
    # unaffected. A classic PAT with no scopes is enough; the advisory database is
    # public and the token only raises the rate limit.
    ghsa:
      enabled: true
      token: ${MEGAREPO_GHSA_TOKEN:}
      # Pages fetched per sync run before handing back a resumable cursor.
      pages-per-sync: 5
      # "reviewed" is GitHub's curated set; "malware" and "unreviewed" also exist.
      type: reviewed
    advisory:
      sync:
        # Deployment-level switch for the scheduled advisory sync
        # (task type security.advisory.sync, seeded by V15 for 02:30 daily).
        # The scheduled_tasks row's own "enabled" flag is the operator's switch;
        # this one is the environment's. Nothing is imported at startup.
        enabled: true
    # Repository firewall, Phase 1 — AUDIT ONLY. NOTHING HERE BLOCKS A DOWNLOAD.
    #
    # The observation runs after the artifact has already been streamed to the
    # client: it identifies the component (purl), asks the local advisory mirror
    # which advisories name it, and writes what it found to firewall_violation.
    # A repository set to QUARANTINE is treated exactly like AUDIT — enforcement
    # is Phase 2, and the recorded rows say so (enforced=false).
    audit:
      enabled: true
      # Mode for repositories with no firewall_repository_config row.
      #
      # OFF by default so that deploying this build changes nothing for an
      # existing installation. Set to AUDIT to observe every repository, which
      # is what a Phase 1 evaluation against real traffic wants; a single
      # repository can be opted in instead by giving it a config row (whose own
      # column default is AUDIT).
      default-mode: OFF
      # Size and backlog of the observation pool. When the backlog is full,
      # observations are dropped and counted — downloads are never slowed down
      # to keep the audit trail complete.
      threads: 2
      queue-capacity: 500
      # An identical finding for the same component in the same repository is
      # recorded at most once per window. A changed advisory set is recorded
      # immediately regardless. Set to 0 to record every single observation.
      suppression-window: 24h
      # Per-node, in-memory shortcut: a path evaluated within this interval is
      # not looked up again. Keeps a hot artifact from re-querying the advisory
      # tables on every request.
      reevaluation-interval: 10m
      reevaluation-cache-size: 10000
  docker:
    default-repository: docker-hosted
  license:
    path: ${MEGAREPO_LICENSE_PATH:./megarepo.license}
