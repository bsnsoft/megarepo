# MegaRepo Helm Chart Values
# See https://github.com/bsnsoft/megarepo for documentation.

replicaCount: 1

image:
  repository: bsnsoft/megarepo
  # Pin a concrete release tag (e.g. "0.10.0-beta-16-g99736bc08b") for
  # reproducible deployments. With the mutable "latest" tag the chart adds a
  # per-release rollout annotation so every `helm upgrade` restarts the pod,
  # and pullPolicy must stay "Always" so the node re-pulls instead of reusing
  # a stale cached image.
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

# The container port the Spring Boot application listens on.
# Must match the server.port in the Docker image's application.yml.
containerPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: megarepo.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: megarepo-tls
    #   hosts:
    #     - megarepo.example.com

persistence:
  enabled: true
  # Use an existing PVC instead of creating one
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 20Gi
  # Mount path inside the container for blob storage
  mountPath: /data

resources:
  requests:
    memory: 256Mi
    cpu: 250m
  limits:
    memory: 1Gi
    cpu: 1000m

# Route all upstream (proxy-repository) traffic through a corporate forward
# proxy, including proxy authentication. Maps to the megarepo.outbound-proxy.*
# Spring properties via environment variables.
# Example:
#   outboundProxy:
#     enabled: true
#     host: proxy.corp.example.com
#     port: 3128
#     username: megarepo
#     existingSecret: megarepo-proxy-credentials   # key: proxy-password
#     nonProxyHosts:
#       - localhost
#       - "*.internal.example.com"
outboundProxy:
  enabled: false
  host: ""
  port: 3128
  # Optional proxy credentials (Basic auth). Leave empty for an unauthenticated proxy.
  username: ""
  # Plaintext password — ends up in the pod spec. Prefer existingSecret in production.
  password: ""
  # Name of an existing Secret containing the proxy password. Takes precedence
  # over .password when set.
  existingSecret: ""
  # Key inside existingSecret that holds the proxy password.
  passwordKey: "proxy-password"
  # Hosts/patterns that bypass the proxy ('*' wildcard supported).
  nonProxyHosts: []

# Web-UI session / JWT settings. Maps to the megarepo.security.jwt.*
# Spring properties via environment variables.
auth:
  # Lifetime of a UI session token (Spring duration format, e.g. 30m, 12h).
  # The web UI renews the token periodically while open (sliding session).
  # Leave empty to use the application default (12h).
  accessTokenExpiry: ""
  # Lifetime of refresh tokens (e.g. 7d). Leave empty for the default (7d).
  refreshTokenExpiry: ""

# Additional environment variables passed to the MegaRepo container.
# Example:
#   env:
#     SPRING_PROFILES_ACTIVE: production
#     JAVA_OPTS: "-Xmx768m"
env: {}

# Spring Boot application properties injected via ConfigMap.
# These are mounted as application-k8s.yml and activated via
# SPRING_PROFILES_ACTIVE=k8s.
# Example:
#   springConfig:
#     megarepo.storage.path: /data/blobs
springConfig: {}

# Liveness and readiness probes use Spring Boot Actuator.
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# -- Bitnami PostgreSQL subchart configuration.
# See https://github.com/bitnami/charts/tree/main/bitnami/postgresql
# IMPORTANT: Change auth.password before deploying to production!
postgresql:
  enabled: true
  auth:
    database: megarepo
    username: megarepo
    # Change this password before deploying to production!
    password: megarepo
  primary:
    persistence:
      enabled: true
      size: 8Gi

# If postgresql.enabled is false, provide an external database URL.
externalDatabase:
  host: ""
  port: 5432
  database: megarepo
  username: megarepo
  password: ""
